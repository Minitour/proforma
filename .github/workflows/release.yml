name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: proforma

permissions:
  contents: write   # create GitHub Releases
  id-token: write   # npm Trusted Publisher (OIDC) + provenance

jobs:
  # ── 1. Build native binaries ────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-latest,        npm_platform: linux-x64,    binary: proforma }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm,     npm_platform: linux-arm64,  binary: proforma }
          - { target: x86_64-apple-darwin,       runner: macos-latest,         npm_platform: darwin-x64,   binary: proforma }
          - { target: aarch64-apple-darwin,      runner: macos-latest,         npm_platform: darwin-arm64, binary: proforma }
          - { target: x86_64-pc-windows-msvc,    runner: windows-latest,       npm_platform: win32-x64,    binary: proforma.exe }
          - { target: aarch64-pc-windows-msvc,   runner: windows-11-arm,       npm_platform: win32-arm64,  binary: proforma.exe }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Set Cargo.toml version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} staging/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.npm_platform }}
          path: staging/${{ matrix.binary }}
          if-no-files-found: error

  # ── 2. Publish to npm and GitHub Releases ───────────────────────────────────
  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Derive version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish platform packages
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          for PLATFORM in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            OS="${PLATFORM%-*}"; CPU="${PLATFORM#*-}"
            BINARY="proforma"; [ "$OS" = "win32" ] && BINARY="proforma.exe"
            PKG="proforma-${PLATFORM}"
            mkdir -p "pkg-${PLATFORM}/bin"
            cp "artifacts/binary-${PLATFORM}/${BINARY}" "pkg-${PLATFORM}/bin/${BINARY}"
            chmod +x "pkg-${PLATFORM}/bin/${BINARY}"
            cat > "pkg-${PLATFORM}/package.json" <<PKGJSON
          {
            "name": "${PKG}",
            "version": "${VERSION}",
            "description": "proforma native binary for ${OS}/${CPU}",
            "os": ["${OS}"],
            "cpu": ["${CPU}"],
            "license": "MIT",
            "files": ["bin"],
            "repository": { "type": "git", "url": "https://github.com/Minitour/proforma.git" }
          }
          PKGJSON
            set +e
            OUTPUT=$(npm publish "./pkg-${PLATFORM}" --access public --provenance 2>&1); CODE=$?
            set -e
            if [ $CODE -ne 0 ] && ! echo "$OUTPUT" | grep -qi "previously published"; then
              echo "$OUTPUT" >&2; exit $CODE
            fi
            echo "$OUTPUT"
          done

      - name: Publish main package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          cd npm
          cp ../README.md README.md
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            for (const k of Object.keys(pkg.optionalDependencies || {})) pkg.optionalDependencies[k] = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          set +e
          OUTPUT=$(npm publish --access public --provenance 2>&1); CODE=$?
          set -e
          if [ $CODE -ne 0 ] && ! echo "$OUTPUT" | grep -qi "previously published"; then
            echo "$OUTPUT" >&2; exit $CODE
          fi
          echo "$OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
