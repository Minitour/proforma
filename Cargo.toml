[package]
name = "proforma"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "MCP server and CLI for reading, editing, linting and diagramming PROforma (.pf) clinical guideline files"
authors = ["Antonio Zaitoun <antonio@zaitoun.dev>"]
license = "MIT"
repository = "https://github.com/Minitour/proforma"
homepage = "https://github.com/Minitour/proforma"
keywords = ["proforma", "mcp", "clinical-guidelines", "cig", "mermaid"]

[[bin]]
name = "proforma"
path = "src/main.rs"

[lib]
name = "proforma"
path = "src/lib.rs"

[dependencies]
rmcp = { version = "3", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
